<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Flickémon Music</title>
<style>
    :root {
        --bg: #12131a; --panel: #1b1d26; --rule: #2a2d38;
        --text: #e9eaf0; --muted: #8a8ea3; --accent: #e05e8c;
    }
    @media (prefers-color-scheme: light) {
        :root { --bg: #f4f3ef; --panel: #fff; --rule: #e0ddd4; --text: #191a1f; --muted: #6b6e7c; }
    }
    * { box-sizing: border-box; }
    body {
        margin: 0; padding: 24px; background: var(--bg); color: var(--text);
        font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex; flex-direction: column; align-items: center; gap: 18px;
    }
    h1 { font-size: 1.1rem; margin: 0; letter-spacing: -0.01em; }
    .sub { color: var(--muted); font-size: 0.82rem; margin: 0; text-align: center; max-width: 46ch; }
    #frame-slot { width: 100%; max-width: 480px; aspect-ratio: 16/9; background: #000; border-radius: 10px; overflow: hidden; }
    #frame-slot iframe { width: 100%; height: 100%; border: 0; display: block; }
    .row { display: flex; gap: 10px; align-items: center; }
    button {
        background: var(--panel); color: var(--text); border: 1px solid var(--rule);
        border-radius: 8px; padding: 9px 14px; cursor: pointer; font: inherit; font-size: 0.85rem;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
    button:hover { border-color: var(--accent); }
    ol { list-style: none; padding: 0; margin: 0; width: 100%; max-width: 480px;
         border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
    li { padding: 10px 14px; border-bottom: 1px solid var(--rule); cursor: pointer; font-size: 0.86rem; display: flex; gap: 10px; }
    li:last-child { border-bottom: 0; }
    li:hover { background: var(--panel); }
    li.current { background: var(--panel); color: var(--accent); font-weight: 700; }
    .n { color: var(--muted); min-width: 1.5em; font-variant-numeric: tabular-nums; }
    .empty { color: var(--muted); font-size: 0.86rem; text-align: center; max-width: 46ch; }
    code { background: var(--panel); padding: 1px 5px; border-radius: 4px; font-size: 0.8rem; }
</style>
</head>
<body>
    <h1>Flickémon Music</h1>
    <p class="sub">Keep this tab open and pinned. Music plays here, so nothing on the
    lecture page can interfere with it — and it stops the moment a lecture starts.</p>

    <div id="frame-slot"></div>

    <div class="row">
        <button id="prev">⏮ Prev</button>
        <button id="play" class="primary">▶ Play</button>
        <button id="next">Next ⏭</button>
    </div>

    <ol id="list"></ol>
    <p class="empty" id="empty" hidden>
        No music yet. Paste YouTube links into <code>content/flickemon-playlist.js</code>,
        reload the extension, then reopen this tab.
    </p>

    <script src="../content/flickemon-playlist.js"></script>
    <script src="../content/flickemon-music.js"></script>
    <script src="player.js"></script>
</body>
</html>
